name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ledkit-color --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-color --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-core --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-core --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-spi --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-spi --all-features --target riscv32imc-unknown-none-elf

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  example-esp32c6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-spi
      - run: cargo build --release
        working-directory: examples/esp32c6-spi

  example-esp32c6-rmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32c6-rmt
            crates/ledkit-esp
      - run: cargo build --release
        working-directory: examples/esp32c6-rmt
      # ledkit-esp is outside the workspace and only builds for an ESP32 target.
      - run: cargo build --features esp32c6 --target riscv32imac-unknown-none-elf
        working-directory: crates/ledkit-esp
      - run: cargo clippy --features esp32c6 --target riscv32imac-unknown-none-elf -- -D warnings
        working-directory: crates/ledkit-esp
      - run: cargo clippy --features esp32c6,smart-leds --target riscv32imac-unknown-none-elf -- -D warnings
        working-directory: crates/ledkit-esp

  example-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/linux-spidev
      - run: cargo build
        working-directory: examples/linux-spidev

  example-teensy4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/teensy4-spi
      - run: cargo build --release
        working-directory: examples/teensy4-spi

  # ESP-IDF (std) example. The first run downloads ESP-IDF and its tools (several
  # minutes); ~/.espressif is cached after that. Uncertain until it has run once on
  # GitHub: the cache key and whether ldproxy needs extra system packages.
  example-esp32c6-esp-idf:
    runs-on: ubuntu-latest
    env:
      # The example's .cargo/config.toml sets a short Windows target-dir (C:/t/ledkit).
      # This overrides it, so the build lands in examples/esp32c6-esp-idf/target, which is
      # where rust-cache below looks.
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      # ESP-IDF's build needs Python, cmake, ninja, git and libusb (it downloads the
      # compiler itself).
      - name: Install ESP-IDF build prerequisites
        run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
      # The example's rust-toolchain.toml pins a nightly (std for ESP-IDF needs
      # build-std); keep this in step with it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-esp-idf
      - uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: espressif-${{ runner.os }}-${{ hashFiles('examples/esp32c6-esp-idf/.cargo/config.toml') }}
      - run: cargo install ldproxy --locked
      - run: cargo build --release
        working-directory: examples/esp32c6-esp-idf
