name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ledkit-color --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-color --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-core --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-core --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-spi --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-spi --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-uart --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-uart --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-layout --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-layout --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-anim --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-anim --all-features --target riscv32imc-unknown-none-elf

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  example-esp32c6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-spi
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-spi

  example-esp32c6-uart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-uart
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-uart
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-uart

  example-esp32c6-rmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32c6-rmt
            crates/ledkit-esp
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-rmt
      # ledkit-esp is outside the workspace and only builds for an ESP32 target.
      - run: cargo build --features esp32c6 --target riscv32imac-unknown-none-elf
        working-directory: crates/ledkit-esp
      - run: cargo clippy --features esp32c6 --target riscv32imac-unknown-none-elf -- -D warnings
        working-directory: crates/ledkit-esp
      - run: cargo clippy --features esp32c6,smart-leds --target riscv32imac-unknown-none-elf -- -D warnings
        working-directory: crates/ledkit-esp
      - run: cargo doc --target riscv32imac-unknown-none-elf --features esp32c6 --no-deps
        working-directory: crates/ledkit-esp
        env:
          RUSTDOCFLAGS: -D warnings

  example-esp32c6-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32c6-matrix
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-matrix
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-matrix

  example-esp32c6-anim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32c6-anim
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-anim
      - run: cargo build --release --locked --features strip
        working-directory: examples/esp32c6-anim
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-anim
      - run: cargo clippy --release --locked --features strip -- -D warnings
        working-directory: examples/esp32c6-anim

  example-anim-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/anim-preview
      - run: cargo build --locked
        working-directory: examples/anim-preview
      - run: cargo clippy --locked -- -D warnings
        working-directory: examples/anim-preview
      - run: cargo run --locked -- list
        working-directory: examples/anim-preview

  example-esp32c6-dotstar-hd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-dotstar-hd
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-dotstar-hd
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-dotstar-hd

  example-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/linux-spidev
      - run: cargo build --locked
        working-directory: examples/linux-spidev

  example-teensy4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/teensy4-spi
      - run: cargo build --release --locked
        working-directory: examples/teensy4-spi

  example-teensy4-anim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/teensy4-anim
      - run: cargo build --release --locked
        working-directory: examples/teensy4-anim
      - run: cargo build --release --locked --features strip
        working-directory: examples/teensy4-anim
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/teensy4-anim
      - run: cargo clippy --release --locked --features strip -- -D warnings
        working-directory: examples/teensy4-anim

  example-teensy4-uart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/teensy4-uart
      - run: cargo build --release --locked
        working-directory: examples/teensy4-uart
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/teensy4-uart

  # ESP-IDF (std) example. The first run downloads ESP-IDF and its tools (several
  # minutes); ~/.espressif is cached after that. Uncertain until it has run once on
  # GitHub: the cache key and whether ldproxy needs extra system packages.
  example-esp32c6-esp-idf:
    runs-on: ubuntu-latest
    env:
      # The example's .cargo/config.toml sets a short Windows target-dir (C:/t/ledkit).
      # This overrides it, so the build lands in examples/esp32c6-esp-idf/target, which is
      # where rust-cache below looks.
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      # ESP-IDF's build needs Python, cmake, ninja, git and libusb (it downloads the
      # compiler itself).
      - name: Install ESP-IDF build prerequisites
        run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
      # The example's rust-toolchain.toml pins a nightly (std for ESP-IDF needs
      # build-std); keep this in step with it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-esp-idf
      - uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: espressif-${{ runner.os }}-${{ hashFiles('examples/esp32c6-esp-idf/.cargo/config.toml') }}
          restore-keys: espressif-${{ runner.os }}-
      - run: cargo install ldproxy --locked
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-esp-idf
      - run: cargo clippy --locked -- -D warnings
        working-directory: examples/esp32c6-esp-idf

  # The text preview page is built from a template and the fonts in assets/fonts;
  # this fails if someone changed one without rebuilding the page.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python site/text-preview/build.py --check

  # ledkit-nrf (nRF52840 PWM + EasyDMA) and the XIAO nRF52840 examples.
  example-nrf52840-pwm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/nrf52840-pwm
            crates/ledkit-nrf
      - run: cargo build --release --locked
        working-directory: examples/nrf52840-pwm
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/nrf52840-pwm
      - run: cargo fmt --check
        working-directory: examples/nrf52840-pwm
      # ledkit-nrf is outside the workspace and only builds for an nRF target.
      - run: cargo fmt --check
        working-directory: crates/ledkit-nrf
      - run: cargo clippy --features nrf52840 --target thumbv7em-none-eabihf -- -D warnings
        working-directory: crates/ledkit-nrf
      - run: cargo clippy --features nrf52840,smart-leds --target thumbv7em-none-eabihf -- -D warnings
        working-directory: crates/ledkit-nrf
      - run: cargo clippy --no-default-features --features nrf52840,smart-leds --target thumbv7em-none-eabihf -- -D warnings
        working-directory: crates/ledkit-nrf
      - run: cargo doc --target thumbv7em-none-eabihf --features nrf52840,smart-leds --no-deps
        working-directory: crates/ledkit-nrf
        env:
          RUSTDOCFLAGS: -D warnings

  example-nrf52840-spi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/nrf52840-spi
      - run: cargo build --release --locked
        working-directory: examples/nrf52840-spi
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/nrf52840-spi
      - run: cargo fmt --check
        working-directory: examples/nrf52840-spi

  example-nrf52840-dotstar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/nrf52840-dotstar
      - run: cargo build --release --locked
        working-directory: examples/nrf52840-dotstar
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/nrf52840-dotstar
      - run: cargo fmt --check
        working-directory: examples/nrf52840-dotstar
