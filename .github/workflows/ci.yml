name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ledkit-color --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-color --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-core --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-core --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-spi --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-spi --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-uart --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-uart --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-layout --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-layout --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-anim --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-anim --all-features --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-text --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-text --all-features --target riscv32imc-unknown-none-elf

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  example-esp32c6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-spi
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-spi

  example-esp32c6-uart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-uart
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-uart
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-uart

  example-esp32c6-rmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32c6-rmt
            crates/ledkit-esp
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-rmt
      # ledkit-esp is outside the workspace and only builds for an ESP32 target.
      - run: cargo build --features esp32c6 --target riscv32imac-unknown-none-elf
        working-directory: crates/ledkit-esp
      - run: cargo clippy --features esp32c6 --target riscv32imac-unknown-none-elf -- -D warnings
        working-directory: crates/ledkit-esp
      - run: cargo clippy --features esp32c6,smart-leds --target riscv32imac-unknown-none-elf -- -D warnings
        working-directory: crates/ledkit-esp
      - run: cargo doc --target riscv32imac-unknown-none-elf --features esp32c6 --no-deps
        working-directory: crates/ledkit-esp
        env:
          RUSTDOCFLAGS: -D warnings

  # ledkit-rp is outside the workspace and only builds for RP targets.
  ledkit-rp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi,thumbv8m.main-none-eabihf,riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ledkit-rp
      - run: cargo clippy --features rp2040 --target thumbv6m-none-eabi -- -D warnings
        working-directory: crates/ledkit-rp
      - run: cargo clippy --features rp2040,smart-leds --target thumbv6m-none-eabi -- -D warnings
        working-directory: crates/ledkit-rp
      - run: cargo clippy --features rp235x,smart-leds --target thumbv8m.main-none-eabihf -- -D warnings
        working-directory: crates/ledkit-rp
      - run: cargo clippy --features rp235x,smart-leds --target riscv32imac-unknown-none-elf -- -D warnings
        working-directory: crates/ledkit-rp
      - run: cargo doc --features rp2040,smart-leds --target thumbv6m-none-eabi --no-deps
        working-directory: crates/ledkit-rp
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --features rp235x,smart-leds --target riscv32imac-unknown-none-elf --no-deps
        working-directory: crates/ledkit-rp
        env:
          RUSTDOCFLAGS: -D warnings

  example-rp2040-pio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/rp2040-pio
      - run: cargo build --release --locked
        working-directory: examples/rp2040-pio
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/rp2040-pio

  # The Pico 2 W example builds for both of the RP2350's core types.
  example-rp2350-pio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv8m.main-none-eabihf,riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/rp2350-pio
      - run: cargo build --release --locked
        working-directory: examples/rp2350-pio
      - run: cargo build --release --locked --target riscv32imac-unknown-none-elf
        working-directory: examples/rp2350-pio
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/rp2350-pio
      - run: cargo clippy --release --locked --target riscv32imac-unknown-none-elf -- -D warnings
        working-directory: examples/rp2350-pio

  example-rp2350-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv8m.main-none-eabihf,riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/rp2350-text
      - run: cargo build --release --locked
        working-directory: examples/rp2350-text
      - run: cargo build --release --locked --target riscv32imac-unknown-none-elf
        working-directory: examples/rp2350-text
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/rp2350-text

  example-esp32c6-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32c6-matrix
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-matrix
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-matrix

  example-esp32c6-anim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32c6-anim
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-anim
      - run: cargo build --release --locked --features strip
        working-directory: examples/esp32c6-anim
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-anim
      - run: cargo clippy --release --locked --features strip -- -D warnings
        working-directory: examples/esp32c6-anim

  example-esp32c6-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32c6-text
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-text
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-text

  # The `ledkit` facade lives outside the workspace (it depends on the board crates), so
  # it is checked here: on the host with the features that build there, and for the
  # ESP32-C6 and nRF52840 with their board features.
  ledkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: riscv32imac-unknown-none-elf, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ledkit
      - run: cargo fmt -- --check
        working-directory: crates/ledkit
      - run: cargo test
        working-directory: crates/ledkit
      - run: cargo test --features spi,uart,smart-leds,embedded-graphics
        working-directory: crates/ledkit
      - run: cargo check --no-default-features
        working-directory: crates/ledkit
      - run: cargo clippy --all-targets --features spi,uart,smart-leds,embedded-graphics -- -D warnings
        working-directory: crates/ledkit
      - run: cargo clippy --target riscv32imac-unknown-none-elf --features esp32c6,spi,uart,smart-leds,embedded-graphics -- -D warnings
        working-directory: crates/ledkit
      - run: cargo build --target thumbv7em-none-eabihf --no-default-features --features nrf52840,async
        working-directory: crates/ledkit
      - run: cargo doc --target riscv32imac-unknown-none-elf --features esp32c6,spi,uart,smart-leds,embedded-graphics --no-deps
        working-directory: crates/ledkit
        env:
          RUSTDOCFLAGS: -D warnings

  example-esp32c6-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32c6-start
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-start
      - run: cargo build --release --locked --features async
        working-directory: examples/esp32c6-start
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-start
      - run: cargo clippy --release --locked --features async -- -D warnings
        working-directory: examples/esp32c6-start

  example-anim-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/anim-preview
      - run: cargo build --locked
        working-directory: examples/anim-preview
      - run: cargo clippy --locked -- -D warnings
        working-directory: examples/anim-preview
      - run: cargo run --locked -- list
        working-directory: examples/anim-preview
      - run: cargo run --locked -- text "hi" --frames 1
        working-directory: examples/anim-preview
      - run: cargo run --locked -- clock --frames 1
        working-directory: examples/anim-preview

  example-esp32c6-dotstar-hd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-dotstar-hd
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-dotstar-hd
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/esp32c6-dotstar-hd

  example-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/linux-spidev
      - run: cargo build --locked
        working-directory: examples/linux-spidev

  example-teensy4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/teensy4-spi
      - run: cargo build --release --locked
        working-directory: examples/teensy4-spi

  example-teensy4-anim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/teensy4-anim
      - run: cargo build --release --locked
        working-directory: examples/teensy4-anim
      - run: cargo build --release --locked --features strip
        working-directory: examples/teensy4-anim
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/teensy4-anim
      - run: cargo clippy --release --locked --features strip -- -D warnings
        working-directory: examples/teensy4-anim

  example-teensy4-uart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/teensy4-uart
      - run: cargo build --release --locked
        working-directory: examples/teensy4-uart
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/teensy4-uart

  # ESP-IDF (std) example. The first run downloads ESP-IDF and its tools (several
  # minutes); ~/.espressif is cached after that. Uncertain until it has run once on
  # GitHub: the cache key and whether ldproxy needs extra system packages.
  example-esp32c6-esp-idf:
    runs-on: ubuntu-latest
    env:
      # The example's .cargo/config.toml sets a short Windows target-dir (C:/t/ledkit).
      # This overrides it, so the build lands in examples/esp32c6-esp-idf/target, which is
      # where rust-cache below looks.
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      # ESP-IDF's build needs Python, cmake, ninja, git and libusb (it downloads the
      # compiler itself).
      - name: Install ESP-IDF build prerequisites
        run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
      # The example's rust-toolchain.toml pins a nightly (std for ESP-IDF needs
      # build-std); keep this in step with it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-esp-idf
      - uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: espressif-${{ runner.os }}-${{ hashFiles('examples/esp32c6-esp-idf/.cargo/config.toml') }}
          restore-keys: espressif-${{ runner.os }}-
      - run: cargo install ldproxy --locked
      - run: cargo build --release --locked
        working-directory: examples/esp32c6-esp-idf
      - run: cargo clippy --locked -- -D warnings
        working-directory: examples/esp32c6-esp-idf

  # ESP32-S3 (Xtensa) examples on esp-hal. Xtensa needs Espressif's `esp` Rust
  # toolchain, which the xtensa-toolchain action installs (the same thing `espup`
  # does on a desktop).
  example-esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32s3-rmt
            examples/esp32s3-check
            examples/esp32s3-matrix
            examples/esp32s3-anim
            examples/esp32s3-dotstar-hd
            examples/esp32s3-text
      - name: Build and lint every esp-hal S3 example
        run: |
          for example in esp32s3-rmt esp32s3-check esp32s3-matrix esp32s3-anim esp32s3-dotstar-hd esp32s3-text; do
            (cd "examples/$example" && cargo build --release --locked && cargo clippy --release --locked -- -D warnings)
          done
          (cd examples/esp32s3-anim && cargo build --release --locked --features strip && cargo clippy --release --locked --features strip -- -D warnings)

  # ESP32-S3 on ESP-IDF (std). Like example-esp32c6-esp-idf, the first run downloads
  # ESP-IDF and its tools; ~/.espressif is cached after that.
  example-esp32s3-esp-idf:
    runs-on: ubuntu-latest
    env:
      # The example's .cargo/config.toml sets a short Windows target-dir; this puts the
      # build back in the example folder, where rust-cache looks.
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP-IDF build prerequisites
        run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/esp32s3-esp-idf
            examples/esp32s3-start-idf
      - uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: espressif-s3-${{ runner.os }}-${{ hashFiles('examples/esp32s3-esp-idf/.cargo/config.toml') }}
          restore-keys: espressif-s3-${{ runner.os }}-
      - run: cargo build --release --locked
        working-directory: examples/esp32s3-esp-idf
      - run: cargo clippy --locked -- -D warnings
        working-directory: examples/esp32s3-esp-idf
      - run: cargo build --release --locked
        working-directory: examples/esp32s3-start-idf
      - run: cargo clippy --locked -- -D warnings
        working-directory: examples/esp32s3-start-idf

  # The text preview page is built from a template and the fonts in assets/fonts;
  # this fails if someone changed one without rebuilding the page.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python site/text-preview/build.py --check
      - run: python tools/test_fontgen.py
      - run: python tools/fontgen.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node site/text-preview/reference.mjs --check

  # ledkit-nrf (nRF52840 PWM + EasyDMA) and the XIAO nRF52840 examples.
  example-nrf52840-pwm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/nrf52840-pwm
            crates/ledkit-nrf
      - run: cargo build --release --locked
        working-directory: examples/nrf52840-pwm
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/nrf52840-pwm
      - run: cargo fmt --check
        working-directory: examples/nrf52840-pwm
      # ledkit-nrf is outside the workspace and only builds for an nRF target.
      - run: cargo fmt --check
        working-directory: crates/ledkit-nrf
      - run: cargo clippy --features nrf52840 --target thumbv7em-none-eabihf -- -D warnings
        working-directory: crates/ledkit-nrf
      - run: cargo clippy --features nrf52840,smart-leds --target thumbv7em-none-eabihf -- -D warnings
        working-directory: crates/ledkit-nrf
      - run: cargo clippy --no-default-features --features nrf52840,smart-leds --target thumbv7em-none-eabihf -- -D warnings
        working-directory: crates/ledkit-nrf
      - run: cargo doc --target thumbv7em-none-eabihf --features nrf52840,smart-leds --no-deps
        working-directory: crates/ledkit-nrf
        env:
          RUSTDOCFLAGS: -D warnings

  example-nrf52840-spi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/nrf52840-spi
      - run: cargo build --release --locked
        working-directory: examples/nrf52840-spi
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/nrf52840-spi
      - run: cargo fmt --check
        working-directory: examples/nrf52840-spi

  example-nrf52840-dotstar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/nrf52840-dotstar
      - run: cargo build --release --locked
        working-directory: examples/nrf52840-dotstar
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: examples/nrf52840-dotstar
      - run: cargo fmt --check
        working-directory: examples/nrf52840-dotstar
