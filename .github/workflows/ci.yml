name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ledkit-color --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-color --target riscv32imc-unknown-none-elf
      - run: cargo build -p ledkit-core --all-features --target thumbv6m-none-eabi
      - run: cargo build -p ledkit-core --all-features --target riscv32imc-unknown-none-elf

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features
