[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["examples", "crates/ledkit-esp", "crates/ledkit-esp-idf", "crates/ledkit-nrf"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jrowe88/ledkit"
authors = ["Jim Rowe"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
