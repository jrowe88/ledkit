[package]
name = "ledkit-esp"
description = "ledkit backend that drives NeoPixels with the ESP32 RMT peripheral through esp-hal (no_std, blocking and async)."
keywords = ["led", "neopixel", "ws2812", "esp32", "rmt"]
categories = ["embedded", "no-std", "hardware-support"]
readme = "README.md"
version = "0.1.0"
edition = "2021"
# esp-hal 1.2 needs Rust 1.95.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jrowe88/ledkit"
authors = ["Jim Rowe"]

[dependencies]
ledkit-core = { path = "../ledkit-core", version = "0.1.0" }
# The RMT driver is behind esp-hal's `unstable` feature. `rt` and the other default
# features belong to the application, not to a library.
esp-hal = { version = "1.2", default-features = false, features = ["unstable"] }
smart-leds-trait = { version = "0.3", default-features = false, optional = true }

[features]
# Pick exactly one chip; esp-hal refuses to build with none or with two.
esp32 = ["esp-hal/esp32"]
esp32c3 = ["esp-hal/esp32c3"]
esp32c6 = ["esp-hal/esp32c6"]
esp32h2 = ["esp-hal/esp32h2"]
esp32s2 = ["esp-hal/esp32s2"]
esp32s3 = ["esp-hal/esp32s3"]
smart-leds = ["dep:smart-leds-trait", "ledkit-core/smart-leds"]

[package.metadata.docs.rs]
features = ["esp32c6", "smart-leds"]
targets = ["riscv32imac-unknown-none-elf"]

# This crate is outside the ledkit workspace (see the root Cargo.toml), so the
# workspace lint table is copied here.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
