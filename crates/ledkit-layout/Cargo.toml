[package]
name = "ledkit-layout"
description = "ledkit layouts: map (x, y) positions on LED matrices onto strip positions. no_std."
keywords = ["led", "neopixel", "matrix", "ws2812", "embedded"]
categories = ["embedded", "no-std", "hardware-support"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ledkit-core = { path = "../ledkit-core", version = "0.1.0" }
ledkit-color = { path = "../ledkit-color", version = "0.1.0" }

embedded-graphics-core = { version = "0.4", optional = true }

[dev-dependencies]
embedded-graphics = "0.8"

[features]
default = []
## Lets a `Canvas` be an `embedded-graphics` `DrawTarget` (text, shapes, images).
embedded-graphics = ["dep:embedded-graphics-core"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
