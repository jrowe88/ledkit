[package]
name = "ledkit-uart"
description = "ledkit backend that drives NeoPixels from any embedded-io serial port (UART) with an inverted output. no_std."
keywords = ["led", "neopixel", "ws2812", "uart", "embedded-io"]
categories = ["embedded", "no-std", "hardware-support"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ledkit-core = { path = "../ledkit-core", version = "0.1.0" }
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
smart-leds-trait = { version = "0.3", default-features = false, optional = true }

[features]
smart-leds = ["dep:smart-leds-trait", "ledkit-core/smart-leds"]

[dev-dependencies]
embassy-futures = "0.1"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
