[package]
name = "esp32s3-text"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

# This example is its own little project. The empty [workspace] table keeps
# Cargo from treating it as part of the ledkit workspace one folder up.
[workspace]

[dependencies]
ledkit-core = { path = "../../crates/ledkit-core" }
ledkit-layout = { path = "../../crates/ledkit-layout" }
ledkit-spi = { path = "../../crates/ledkit-spi" }
ledkit-text = { path = "../../crates/ledkit-text" }

esp-hal = { version = "1.2", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18", features = ["esp32s3"] }

[profile.dev]
# Rust code is very slow without optimization on a microcontroller.
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
