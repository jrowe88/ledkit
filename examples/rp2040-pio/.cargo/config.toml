[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
]
# Hold BOOT, tap RESET (the board shows up as a drive), then `cargo run --release`.
# picotool makes the UF2 and loads it. `elf2uf2-rs -d` works too: swap the lines.
runner = "picotool load -u -v -x -t elf"
# runner = "elf2uf2-rs -d"
