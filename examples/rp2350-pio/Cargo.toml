[package]
name = "rp2350-pio"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

# This example is its own little project. The empty [workspace] table keeps
# Cargo from treating it as part of the ledkit workspace one folder up.
[workspace]

[dependencies]
ledkit-core = { path = "../../crates/ledkit-core" }
ledkit-rp = { path = "../../crates/ledkit-rp", features = ["rp235x"] }
ledkit-spi = { path = "../../crates/ledkit-spi" }
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }
embedded-hal = "1.0"
embassy-futures = "0.1"
static_cell = "2"
panic-halt = "1"

[profile.dev]
# Rust code is very slow without optimization on a microcontroller.
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
